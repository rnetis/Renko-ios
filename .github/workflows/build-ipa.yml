name: Build IPA

# Builds an UNSIGNED release IPA on every push to main (and on tags/dispatch).
# No Apple certificate is used — sideload the IPA with Sideloadly / AltStore /
# TrollStore, or open the project in Xcode and sign with your own team.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Pure-Foundation core (engine, analysis, models) via SwiftPM — no simulator.
  # Runs in parallel with the IPA build. Once it has been green on main, add
  # `needs: test` to `build-ipa` below so a failing test blocks the release.
  test:
    name: Unit tests (RenkoCore)
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run tests
        run: swift test

  build-ipa:
    name: Archive & package unsigned IPA
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive (unsigned, Release)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project ToobitRenko.xcodeproj \
            -scheme ToobitRenko \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ToobitRenko.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee build.log | tail -40

      - name: Package IPA
        run: |
          APP_PATH=$(find build/ToobitRenko.xcarchive/Products/Applications -maxdepth 1 -name '*.app' | head -1)
          echo "Found app bundle: $APP_PATH"
          test -n "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -q -r ToobitRenko-unsigned.ipa Payload
          ls -lh ToobitRenko-unsigned.ipa

      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ToobitRenko-unsigned-ipa
          path: ToobitRenko-unsigned.ipa
          if-no-files-found: error

      - name: Read app version
        id: version
        run: |
          VERSION=$(sed -n 's/.*MARKETING_VERSION: *"\{0,1\}\([0-9][0-9.]*\)"\{0,1\}.*/\1/p' project.yml | head -1)
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved MARKETING_VERSION: $VERSION"

      # A push to main cuts the release for the current MARKETING_VERSION
      # (creating the vX.Y.Z tag at the pushed commit if it does not exist yet), and
      # a v* tag push publishes that tag. Cutting a new release therefore just
      # means bumping MARKETING_VERSION in project.yml and pushing to main.
      - name: Cut GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v${{ steps.version.outputs.version }}"
          fi
          echo "Release tag: $TAG (ref: $GITHUB_REF)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — updating its IPA asset."
            gh release upload "$TAG" ToobitRenko-unsigned.ipa --clobber
          else
            gh release create "$TAG" \
              --title "Toobit Renko $TAG" \
              --generate-notes \
              --target "$GITHUB_SHA" \
              ToobitRenko-unsigned.ipa
          fi
